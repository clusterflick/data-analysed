# Triggered by an external cron rather than GitHub's scheduler, the same way
# data-retrieved is - GitHub's `schedule` is best-effort and drops runs under
# load, and a publish-timing log is only as good as the regularity of its
# sampling.
on:
  workflow_dispatch:

name: Venue Health

permissions:
  contents: read

# The log is appended in place: the collect job reads the day's release asset,
# adds this cycle's rows and writes it back. Two cycles overlapping would lose
# one of them, so they queue instead of cancelling - a delayed cycle is still
# worth recording, an abandoned one is a hole in the series.
concurrency:
  group: venue-health
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------
  # Probes that run fine from a GitHub-hosted runner
  # ------------------------------------------------------------------------------
  # Every venue probed here also retrieves from a GitHub-hosted runner in
  # data-retrieved, so a datacentre IP is known to get through.
  probe_hosted:
    name: Probe (GitHub-hosted)
    runs-on: ubuntu-latest
    # A challenged probe waits ~60s and retries, so a bad cycle is minutes not
    # seconds. Bounded because cycles queue on the concurrency group: one wedged
    # run would stall every cycle behind it.
    timeout-minutes: 20
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main

      # A location is either a chain group or a single venue, and the two look
      # the same from here - `scripts/health` resolves whichever it was handed.
      # Listed alphabetically for that reason: venues that share a probe are not
      # adjacent (Castle's two domains, Olympic Studios' three), and ordering by
      # the relationship would only hide that the list is flat.
      #
      # Every step runs even when an earlier one fails: each is an independent
      # observation, and a chain being down is not a reason to stop looking at
      # the others.
      - name: castlesidcup.com
        if: always()
        run: npm run health -- castlesidcup.com

      - name: electriccinema.co.uk
        if: always()
        run: npm run health -- electriccinema.co.uk

      - name: everymancinema.com
        if: always()
        run: npm run health -- everymancinema.com

      - name: forestcinema.co.uk
        if: always()
        run: npm run health -- forestcinema.co.uk

      - name: genesiscinema.co.uk
        if: always()
        run: npm run health -- genesiscinema.co.uk

      - name: olympiccinema.com
        if: always()
        run: npm run health -- olympiccinema.com

      - name: omniplex.co.uk
        if: always()
        run: npm run health -- omniplex.co.uk

      - name: picturehouses.com
        if: always()
        run: npm run health -- picturehouses.com

      - name: princecharlescinema.com
        if: always()
        run: npm run health -- princecharlescinema.com

      - name: thecastlecinema.com
        if: always()
        run: npm run health -- thecastlecinema.com

      - name: thecinemaatselfridges.com
        if: always()
        run: npm run health -- thecinemaatselfridges.com

      - name: thecinemainthepowerstation.com
        if: always()
        run: npm run health -- thecinemainthepowerstation.com

      # Rows are written before a probe is allowed to fail the step, so this
      # uploads the evidence of a failed cycle as well as a healthy one.
      #
      # Retried twice, here and in every probe job. upload-artifact retries a
      # 5xx but throws on a socket error (ECONNRESET, ETIMEDOUT) at the first
      # attempt, and on 20 Oct one reset at CreateArtifact cost a cycle 43
      # venues' rows that had been probed fine. The resets come in spells
      # rather than one at a time: on 21 Oct a self-hosted runner was reset 30s
      # apart, while another runner on the same network uploaded between the
      # two, and a re-run on the first ten minutes later went through. So the
      # last attempt waits minutes, not seconds - a few minutes on a cycle is
      # cheap beside losing its rows. Every attempt but the last is allowed to
      # fail so the next can run; the last is not, so a third failure still
      # fails the job. `overwrite` in case an earlier attempt got as far as
      # creating the artifact.
      - name: Upload health data
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: health_hosted
          path: health-data/
          if-no-files-found: error

      - name: Wait before retrying the upload
        if: always() && steps.upload.outcome == 'failure'
        run: sleep 30

      - name: Retry health data upload
        id: retry
        if: always() && steps.upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: health_hosted
          path: health-data/
          if-no-files-found: error
          overwrite: true

      - name: Wait before the last upload attempt
        if: always() && steps.retry.outcome == 'failure'
        run: sleep 180

      - name: Last health data upload attempt
        if: always() && steps.retry.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: health_hosted
          path: health-data/
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------------------
  # Probes that need a browser, plus any that a datacentre IP gets blocked from.
  # Cineworld needs no browser but sits behind Cloudflare: from a GitHub-hosted
  # runner every one of its twelve venues came back `cf-mitigated` 403, on the
  # retry as well as the first attempt. The residential IP clears it.
  # ------------------------------------------------------------------------------
  probe_self_hosted:
    name: Probe (self-hosted)
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main
        with:
          playwright: true

      - name: bfi.org.uk
        if: always()
        run: npm run health -- bfi.org.uk

      - name: cineworld.co.uk
        if: always()
        run: npm run health -- cineworld.co.uk

      - name: curzon.com
        if: always()
        run: npm run health -- curzon.com

      - name: odeon.co.uk
        if: always()
        run: npm run health -- odeon.co.uk

      - name: Upload health data
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: health_self_hosted
          path: health-data/
          if-no-files-found: error

      - name: Wait before retrying the upload
        if: always() && steps.upload.outcome == 'failure'
        run: sleep 30

      - name: Retry health data upload
        id: retry
        if: always() && steps.upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: health_self_hosted
          path: health-data/
          if-no-files-found: error
          overwrite: true

      - name: Wait before the last upload attempt
        if: always() && steps.retry.outcome == 'failure'
        run: sleep 180

      - name: Last health data upload attempt
        if: always() && steps.retry.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: health_self_hosted
          path: health-data/
          if-no-files-found: error
          overwrite: true

      # A bot challenge is recorded in the row, but the screenshot and page dump
      # are the only way to tell which flavour of block it was - see the Curzon
      # challenge that first showed up as a misclassified probe error.
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-self_hosted
          path: ./playwright-failures
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------
  # Vue on its own
  # ------------------------------------------------------------------------------
  # Fifteen venues fetched one at a time from a single page session, which is the
  # longest single probe by some way. Parallel jobs pay setup concurrently, so
  # the self-hosted side can never finish sooner than setup plus its slowest
  # probe - splitting the slowest one out is the only thing that moves that
  # floor, and splitting any further buys nothing.
  probe_vue:
    name: Probe (Vue)
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main
        with:
          playwright: true

      - name: myvue.com
        run: npm run health -- myvue.com

      - name: Upload health data
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: health_vue
          path: health-data/
          if-no-files-found: error

      - name: Wait before retrying the upload
        if: always() && steps.upload.outcome == 'failure'
        run: sleep 30

      - name: Retry health data upload
        id: retry
        if: always() && steps.upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: health_vue
          path: health-data/
          if-no-files-found: error
          overwrite: true

      - name: Wait before the last upload attempt
        if: always() && steps.retry.outcome == 'failure'
        run: sleep 180

      - name: Last health data upload attempt
        if: always() && steps.retry.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: health_vue
          path: health-data/
          if-no-files-found: error
          overwrite: true

      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-vue
          path: ./playwright-failures
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------
  # Fold this cycle into the day's log
  # ------------------------------------------------------------------------------
  append_log:
    name: Append to Log
    runs-on: ubuntu-latest
    # Runs when a probe job failed - those rows say why, and dropping them would
    # lose exactly the cycles worth looking at - but not when one was cancelled,
    # where the rows are an arbitrary fraction of a cycle rather than a finding.
    # `always()` would include the cancelled case; this doesn't. A job that hits
    # its `timeout-minutes` counts as failed, not cancelled, so a stalled probe
    # still gets its partial cycle recorded.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    needs: [probe_hosted, probe_self_hosted, probe_vue]
    env:
      TZ: Europe/London
      # Every artifact the probe jobs above upload - one per job. A new probe
      # job's artifact goes here and gets a download step below, or the append
      # can't tell its rows went missing.
      HEALTH_ARTIFACTS: health_hosted health_self_hosted health_vue
    steps:
      - uses: clusterflick/.github/setup@main

      - name: Generate tag
        # One release a day, appended to hourly, rather than a release a cycle -
        # 24 releases a day would bury every other repo's in the timeline.
        run: echo "TAG=$(TZ=Europe/London date +'%Y%m%d')" >> $GITHUB_ENV

      # Which probe jobs got their rows uploaded - established from the run's
      # artifact list, not inferred from a download failing, for the same reason
      # as the day's log below: a transient error read as "missing" would drop
      # rows that exist. A failed listing fails the job. A missing artifact
      # doesn't; the append below names it and the last step fails on it, once
      # the rows that did arrive are published.
      - name: Check which probe jobs uploaded health data
        id: uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.expired | not) | .name')
          for name in $HEALTH_ARTIFACTS; do
            if grep -qx "$name" <<< "$names"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # One download per artifact, each into its own directory, so the append
      # can tell which job's rows it holds. Not a `health_*` pattern:
      # download-artifact extracts a pattern matching a single artifact flat,
      # so the cycle where two uploads failed is the one the survivor's rows
      # would arrive without saying whose they were. By name also keeps a
      # failed probe's screenshot and page dump out - the append parses every
      # file it is given as rows.
      - name: Download health_hosted
        if: steps.uploaded.outputs.health_hosted == 'true'
        uses: actions/download-artifact@v8
        with:
          name: health_hosted
          path: health-data/health_hosted
          github-token: ${{ github.token }}

      - name: Download health_self_hosted
        if: steps.uploaded.outputs.health_self_hosted == 'true'
        uses: actions/download-artifact@v8
        with:
          name: health_self_hosted
          path: health-data/health_self_hosted
          github-token: ${{ github.token }}

      - name: Download health_vue
        if: steps.uploaded.outputs.health_vue == 'true'
        uses: actions/download-artifact@v8
        with:
          name: health_vue
          path: health-data/health_vue
          github-token: ${{ github.token }}

      # Absent on the day's first cycle, which is not an error - the append
      # script starts a new log when the file isn't there. But "absent" has to
      # be established, not inferred from a failed download: this step used to
      # be `continue-on-error`, so on 23 Sep a transient 404 fetching an asset
      # that existed read as "first cycle", and the upload below replaced ten
      # cycles with one. Only a release or asset that is genuinely missing
      # starts a new log; anything else fails the job and leaves the day's log
      # as it was - a lost cycle, rather than a lost day.
      - name: Check for the day's log so far
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: health-log.jsonl
        run: scripts/rolling-log.sh locate "$TAG" "$ASSET"

      - name: Download the day's log so far
        if: steps.existing.outputs.exists == 'true'
        uses: clusterflick/release-downloader@v4
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-analysed"
          tag: ${{ env.TAG }}
          fileName: ${{ steps.existing.outputs.name }}
          out-file-path: "output"

      # Only differs when continuing from a publish that did not finish.
      - name: Use the located log
        if: steps.existing.outputs.exists == 'true' && steps.existing.outputs.name != 'health-log.jsonl'
        env:
          NAME: ${{ steps.existing.outputs.name }}
        run: mv "output/$NAME" output/health-log.jsonl

      # Unquoted on purpose: one argument per artifact.
      - name: Append this cycle
        run: npm run health:append-log -- health-data output/health-log.jsonl $HEALTH_ARTIFACTS

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          tag: ${{ env.TAG }}
          commit: main
          body: |
            Hourly venue health observations for ${{ env.TAG }}.
            One JSON row per venue per cycle - see scripts/health in
            clusterflick/scripts for the row shape.

            ⚠️ **Internal telemetry — not licensed.** This drives the status panel on clusterflick.com and the venue health badge. No rights are granted over it and the row shape changes without notice. For data you can use, see https://clusterflick.com/data-licence

      # Not the release action's `replacesArtifacts`, which deletes the old log
      # before uploading the new one - see scripts/rolling-log.sh.
      - name: Publish the log
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.TAG }}
        run: scripts/rolling-log.sh publish "$TAG" health-log.jsonl output/health-log.jsonl

      # Rebuilds manage.clusterflick.com, whose venues page leads with the
      # sources failing as of the latest cycle - this one.
      - name: Repository Dispatch for manage.clusterflick.com
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: clusterflick/manage.clusterflick.com
          event-type: venue_health

      # The append script writes a red badge when it fails, but a step before it
      # failing - on 30 Sep a transient error downloading the day's log - means
      # it never ran, no badge file exists, and the publish below failed on the
      # missing file instead, leaving the last green badge up. Only on failure:
      # a green job with no badge file is a bug for the publish to report.
      - name: Write failed badge
        if: ${{ failure() && hashFiles('output/venue-health.json') == '' }}
        run: |
          node -e 'require("./scripts/common/badge").writeBadgeFile("venue-health.json", { label: "venue health", message: "cycle failed", color: "red" })'

      - name: Publish badge
        if: always()
        env:
          GIST_ID: 8d80a800fce80abc822d054b9e91ba0c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/publish-badge.js venue-health.json

      # Last, so the rows that did arrive are published and the badge says what
      # is missing before the job goes red for it.
      - name: Fail on missing health data
        run: |
          if [ -s output/missing.txt ]; then
            echo "::error::No health data arrived from: $(paste -sd, output/missing.txt)"
            exit 1
          fi
