# Triggered by an external cron rather than GitHub's scheduler, the same way
# data-retrieved is - GitHub's `schedule` is best-effort and drops runs under
# load, and a publish-timing log is only as good as the regularity of its
# sampling.
on:
  workflow_dispatch:

name: Venue Health

permissions:
  contents: read

# The log is appended in place: the collect job reads the day's release asset,
# adds this cycle's rows and writes it back. Two cycles overlapping would lose
# one of them, so they queue instead of cancelling - a delayed cycle is still
# worth recording, an abandoned one is a hole in the series.
concurrency:
  group: venue-health
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------
  # Probes that run fine from a GitHub-hosted runner
  # ------------------------------------------------------------------------------
  # Castle, Admit One and Omniplex retrieve from a self-hosted runner, which is
  # not an argument for probing from one: data-retrieved buckets every
  # standalone venue into `retrieve_remaining_cinemas_*`, self-hosted with a
  # browser for the whole job rather than per venue. None of these probes opens
  # one, and princecharlescinema.com sits in that same bucket and probes from
  # here. Electric and Olympic Studios need no such argument - they retrieve
  # from a GitHub-hosted runner already.
  probe_hosted:
    name: Probe (GitHub-hosted)
    runs-on: ubuntu-latest
    # A challenged probe waits ~60s and retries, so a bad cycle is minutes not
    # seconds. Bounded because cycles queue on the concurrency group: one wedged
    # run would stall every cycle behind it.
    timeout-minutes: 20
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main

      # A location is either a chain group or a single venue, and the two look
      # the same from here - `scripts/health` resolves whichever it was handed.
      # Listed alphabetically for that reason: venues that share a probe are not
      # adjacent (Castle's two domains, Olympic Studios' three), and ordering by
      # the relationship would only hide that the list is flat.
      #
      # Every step runs even when an earlier one fails: each is an independent
      # observation, and a chain being down is not a reason to stop looking at
      # the others.
      - name: castlesidcup.com
        if: always()
        run: npm run health -- castlesidcup.com

      - name: electriccinema.co.uk
        if: always()
        run: npm run health -- electriccinema.co.uk

      - name: everymancinema.com
        if: always()
        run: npm run health -- everymancinema.com

      - name: forestcinema.co.uk
        if: always()
        run: npm run health -- forestcinema.co.uk

      - name: genesiscinema.co.uk
        if: always()
        run: npm run health -- genesiscinema.co.uk

      - name: olympiccinema.com
        if: always()
        run: npm run health -- olympiccinema.com

      - name: omniplex.co.uk
        if: always()
        run: npm run health -- omniplex.co.uk

      - name: picturehouses.com
        if: always()
        run: npm run health -- picturehouses.com

      - name: princecharlescinema.com
        if: always()
        run: npm run health -- princecharlescinema.com

      - name: thecastlecinema.com
        if: always()
        run: npm run health -- thecastlecinema.com

      - name: thecinemaatselfridges.com
        if: always()
        run: npm run health -- thecinemaatselfridges.com

      - name: thecinemainthepowerstation.com
        if: always()
        run: npm run health -- thecinemainthepowerstation.com

      # Rows are written before a probe is allowed to fail the step, so this
      # uploads the evidence of a failed cycle as well as a healthy one.
      - name: Upload health data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health_hosted
          path: health-data/
          if-no-files-found: error

  # ------------------------------------------------------------------------------
  # Probes that need a browser, plus any that a datacentre IP gets blocked from.
  # Cineworld needs no browser but sits behind Cloudflare: from a GitHub-hosted
  # runner every one of its twelve venues came back `cf-mitigated` 403, on the
  # retry as well as the first attempt. The residential IP clears it.
  # ------------------------------------------------------------------------------
  probe_self_hosted:
    name: Probe (self-hosted)
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main
        with:
          playwright: true

      - name: bfi.org.uk
        if: always()
        run: npm run health -- bfi.org.uk

      - name: cineworld.co.uk
        if: always()
        run: npm run health -- cineworld.co.uk

      - name: curzon.com
        if: always()
        run: npm run health -- curzon.com

      - name: odeon.co.uk
        if: always()
        run: npm run health -- odeon.co.uk

      - name: Upload health data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health_self_hosted
          path: health-data/
          if-no-files-found: error

      # A bot challenge is recorded in the row, but the screenshot and page dump
      # are the only way to tell which flavour of block it was - see the Curzon
      # challenge that first showed up as a misclassified probe error.
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-self_hosted
          path: ./playwright-failures
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------
  # Vue on its own
  # ------------------------------------------------------------------------------
  # Fifteen venues fetched one at a time from a single page session, which is the
  # longest single probe by some way. Parallel jobs pay setup concurrently, so
  # the self-hosted side can never finish sooner than setup plus its slowest
  # probe - splitting the slowest one out is the only thing that moves that
  # floor, and splitting any further buys nothing.
  probe_vue:
    name: Probe (Vue)
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main
        with:
          playwright: true

      - name: myvue.com
        run: npm run health -- myvue.com

      - name: Upload health data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health_vue
          path: health-data/
          if-no-files-found: error

      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-vue
          path: ./playwright-failures
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------
  # Fold this cycle into the day's log
  # ------------------------------------------------------------------------------
  append_log:
    name: Append to Log
    runs-on: ubuntu-latest
    # Runs when a probe job failed - those rows say why, and dropping them would
    # lose exactly the cycles worth looking at - but not when one was cancelled,
    # where the rows are an arbitrary fraction of a cycle rather than a finding.
    # `always()` would include the cancelled case; this doesn't. A job that hits
    # its `timeout-minutes` counts as failed, not cancelled, so a stalled probe
    # still gets its partial cycle recorded.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    needs: [probe_hosted, probe_self_hosted, probe_vue]
    env:
      TZ: Europe/London
    steps:
      - uses: clusterflick/.github/setup@main

      - name: Generate tag
        # One release a day, appended to hourly, rather than a release a cycle -
        # 24 releases a day would bury every other repo's in the timeline.
        run: echo "TAG=$(TZ=Europe/London date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Download this cycle's health data
        uses: actions/download-artifact@v8
        with:
          # Only the row artifacts. Without a pattern this takes every artifact
          # in the run, and `merge-multiple` flattens them into one directory -
          # so a browser probe's screenshot and page dump land beside the rows
          # and the append below tries to parse a PNG as JSON. Those artifacts
          # only exist when a probe failed, which is exactly the cycle the log
          # most wants to keep, so the names are kept disjoint rather than
          # relying on the append to skip them.
          pattern: health_*
          path: health-data/
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Download the day's log so far
        # Absent on the day's first cycle, which is not an error - the append
        # script starts a new log when the file isn't there.
        continue-on-error: true
        uses: clusterflick/release-downloader@v3
        with:
          token: ${{ secrets.PAT }}
          repository: "clusterflick/data-analysed"
          tag: ${{ env.TAG }}
          fileName: "health-log.jsonl"
          out-file-path: "output"

      - name: Append this cycle
        run: npm run health:append-log -- health-data output/health-log.jsonl

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "output/health-log.jsonl"
          makeLatest: false
          tag: ${{ env.TAG }}
          commit: main
          body: |
            Hourly venue health observations for ${{ env.TAG }}.
            One JSON row per venue per cycle - see scripts/health in
            clusterflick/scripts for the row shape.

            ⚠️ **Internal telemetry — not licensed.** This drives the status panel on clusterflick.com and the venue health badge. No rights are granted over it and the row shape changes without notice. For data you can use, see https://clusterflick.com/data-licence

      - name: Publish badge
        if: always()
        env:
          GIST_ID: 8d80a800fce80abc822d054b9e91ba0c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/publish-badge.js venue-health.json
